<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Task Tracker</h1>
    <p class="subtitle">Add tasks, tick them off, and filter the list. Your tasks stay in this browser.</p>

    <form id="task-form" autocomplete="off">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" maxlength="120" placeholder="What needs to be done?" aria-describedby="task-error">
      <button type="submit">Add</button>
    </form>
    <p id="task-error" class="error" role="alert"></p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">To do</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <div class="footer-row">
      <p id="summary" aria-live="polite"></p>
      <button type="button" id="clear-done" class="link-button">Clear completed</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
